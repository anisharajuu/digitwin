name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  twin-core:
    name: twin-core (python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/twin-core
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Test
        run: uv run pytest -q

      - name: Lint repo tooling
        working-directory: .
        run: uv run --project services/twin-core ruff check .

  console:
    name: console (typescript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/console
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/console/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: Build
        run: npm run build

  images:
    name: docker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build twin-core image
        uses: docker/build-push-action@v6
        with:
          context: services/twin-core
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build console image
        uses: docker/build-push-action@v6
        with:
          context: apps/console
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
