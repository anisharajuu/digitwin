    design:
      rated_cooling_kw: 1200.0
      rated_cop: 4.6
      supply_setpoint_c: 7.0
      ambient_c: 14.0

  # ----------------------------------------------------------- A30 reaction
  - id: RX-301
    name: Jacketed Reactor
    kind: reactor
    area: A30
    criticality: critical
    manufacturer: Pfaudler
    model: PF-16JR
    commissioned: 2019-06-11
